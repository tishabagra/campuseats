openapi: 3.0.3
info:
  title: CampusEats Orders Service
  version: 1.0.0
  description: REST API for creating, reading, filtering and cancelling CampusEats orders.
servers:
  - url: http://localhost:3000
paths:
  /orders:
    post:
      summary: Create an order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created or original idempotent result returned
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      summary: List orders by status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Matching orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /orders/{id}:
    get:
      summary: Get one order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/cancellation:
    post:
      summary: Cancel an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancellationRequest' }
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
  schemas:
    CreateOrderRequest:
      type: object
      required: [userId, items, total]
      properties:
        userId: { type: integer, minimum: 1 }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total: { type: number, exclusiveMinimum: 0 }
    OrderItem:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1 }
    CancellationRequest:
      type: object
      properties:
        reason: { type: string }
    Order:
      type: object
      required: [id, userId, items, total, status, paymentId]
      properties:
        id: { type: integer }
        userId: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        total: { type: number }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentId: { type: string, nullable: true }
    OrderStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED]
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Valid request rejected by domain
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
