<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusEats Catalogue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CampusEats</h1>
        <p>College Food Catalogue</p>
    </header>
    <main>
        <section>
            <h2>Available Menu Items</h2>
            <div id="itemList" class="item-list"></div>
        </section>

        <section class="search-section">
    <h2>Find Menu Item</h2>

    <form id="searchForm">
        <label for="searchId">Enter Item ID</label>
        <input
            type="number"
            id="searchId"
            placeholder="Enter item ID"
            min="1"
            required
        >

        <button type="submit">Search Item</button>
    </form>

    <div id="searchResult"></div>
</section>


        <section class="form-section">
            <h2>Add New Menu Item</h2>
            <form id="itemForm">
                <label for="name">Food Name</label>
                <input type="text" id="name" placeholder="Enter food name" required>
                <label for="price">Price (₹)</label>
                <input type="number" id="price" placeholder="Enter price" min="1" required>
                <label class="availability-label">
                    <input type="checkbox" id="available" checked>
                    Available
                </label>
                <button type="submit">Add Item</button>
            </form>
            <p id="message"></p>
        </section>
    </main>

    <script>
        const itemList = document.getElementById('itemList');
        const itemForm = document.getElementById('itemForm');
        const message = document.getElementById('message');

        async function loadItems() {
            try {
                const response = await fetch('/items');
                const items = await response.json();
                itemList.innerHTML = '';
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';

                    const name = document.createElement('h3');
                    name.textContent = item.name;

                    const price = document.createElement('p');
                    price.textContent = `Price: ₹${item.price}`;

                    const availability = document.createElement('p');
                    availability.textContent = item.available
                        ? 'Available'
                        : 'Currently unavailable';

                    card.append(name, price, availability);
                    itemList.appendChild(card);
                });
            } catch (error) {
                message.textContent = 'Unable to load menu items.';
            }
        }

        // Get one item by ID
const searchForm = document.getElementById('searchForm');
const searchResult = document.getElementById('searchResult');

searchForm.addEventListener('submit', async function(event) {
    event.preventDefault();

    const id = document.getElementById('searchId').value;

    try {
        const response = await fetch(`/items/${id}`);
        const result = await response.json();

        searchResult.innerHTML = '';

        if (response.status === 200) {
            const card = document.createElement('div');
            card.className = 'item-card';

            const name = document.createElement('h3');
            name.textContent = result.name;

            const price = document.createElement('p');
            price.textContent = `Price: ₹${result.price}`;

            const availability = document.createElement('p');
            availability.textContent = result.available
                ? 'Available'
                : 'Currently unavailable';

            card.append(name, price, availability);
            searchResult.appendChild(card);
        } else if (response.status === 404) {
            searchResult.textContent = 'Item not found!';
            searchResult.className = 'not-found';
        }
    } catch (error) {
        searchResult.textContent = 'Server connection failed.';
    }
});

        itemForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const newItem = {
                name: document.getElementById('name').value,
                price: Number(document.getElementById('price').value),
                available: document.getElementById('available').checked
            };

            try {
                const response = await fetch('/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newItem)
                });

                const result = await response.json();

                if (response.status === 201) {
                    message.textContent = 'Item added successfully!';
                    itemForm.reset();
                    document.getElementById('available').checked = true;
                    await loadItems();
                } else {
                    message.textContent = result.error || 'Unable to add item.';
                }
            } catch (error) {
                message.textContent = 'Server connection failed.';
            }
        });

        // Load items when page opens
        loadItems();
    </script>

</body>
</html>
